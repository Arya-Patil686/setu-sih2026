[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setu"
version = "0.1.0"
description = "SETU - sub-pixel multi-sensor registration of Chandrayaan-2 imagery against lunar reference maps (SIH 2026, PS 26166)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team HyperNova" }]

dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "opencv-contrib-python-headless>=4.9",
  "scikit-image>=0.22",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "imageio>=2.34",
  "pds4_tools>=1.3",
  "pvl>=1.3",
  "spiceypy>=6.0",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "torchvision>=0.17", "kornia>=0.7"]
api  = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev  = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
setu = "setu.cli:app"

[tool.setuptools.packages.find]
include = ["setu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
