name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # The demo data and imagery are committed rather than regenerated here. Building
      # them needs torch and a model checkpoint, and a results page that silently rebuilds
      # its own evidence on every deploy is a page whose numbers nobody can pin down.
      - name: Check the demo bundle is present
        run: |
          test -f web/public/demo/demo.json || {
            echo "web/public/demo/demo.json is missing."
            echo "Run: python scripts/build_demo_bundle.py"
            exit 1
          }
          test -f web/public/demo/eval.json

      - run: npm run build
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages serves 404.html for unknown paths. A single-page app needs that to be
      # the app itself, or a deep link reloads into a 404.
      - run: cp web/dist/index.html web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
