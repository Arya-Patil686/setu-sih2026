name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev,api]" kornia

      - name: Lint
        run: ruff check setu api tests

      - name: Unit tests
        run: pytest tests -q --durations=10

      # The gate from Section 12: a complete run on a tiny synthetic pair, measured
      # against a transform that is known exactly. It fails if any stage stops
      # contributing, which no unit test would catch on its own.
      - name: End-to-end run on a tiny pair
        run: pytest tests/test_e2e_tiny.py -q

      - name: CLI smoke test
        run: |
          setu info
          setu eval --out /tmp/eval --methods sift,setu_full --size 768 \
                    --no-scale-sweep --bootstrap 50
          test -f /tmp/eval/leaderboard.md
          cat /tmp/eval/leaderboard.md

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t setu:ci .
      - name: Container answers its health check
        run: |
          docker run -d --name setu -p 8000:8000 setu:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 3
          done
          docker logs setu
          exit 1
